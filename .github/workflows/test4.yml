name: Debug Test npm

on: workflow_dispatch

jobs:
  build-core:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - uses: actions/setup-node@v7

      - name: Initialize Environment
        run: ${{ secrets.NM_API_KEY }} && ./nm.sh setup

      - name: npm Build
        working-directory: nm
        run: ./nm.sh build

      - name: npm clean
        working-directory: nm
        if: always()
        run: ./nm.sh clean
