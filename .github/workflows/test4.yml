name: Debug Pyt3 Test

on: workflow_dispatch

permissions:
  id-token: write
  contents: read

jobs:
  build-core:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          hostname: duck2
          tags: tag:ci
          log-mode: quiet

      - name: Initialize Environment
        run: python main.py setup

      - name: duck Build
        run: python main.py build

      - name: duck clean
        if: always()
        run: python main.py clean
