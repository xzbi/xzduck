name: Debug Js Test

on: workflow_dispatch

jobs:
  build-core:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Initialize Environment
        run: ./nm.sh setup

      - name: npm Build      
        run: ./nm.sh build

      - name: npm clean
        if: always()
        run: ./nm.sh clean
