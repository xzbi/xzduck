name: Debug Py Test

on: workflow_dispatch

permissions:
  id-token: write
  contents: read

jobs:
  build-core:
    runs-on: windows-latest
    timeout-minutes: 360
    env:
      TS_GP: ${{ secrets.TS_GP }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Checkout tools repo
        uses: actions/checkout@v7
        with:
          repository: 1mnt/nomnt
          path: tools
          token: ${{ secrets.TS_GP }}

      - name: Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          hostname: duck1
          tags: tag:ci
          log-mode: quiet

      - uses: robinraju/release-downloader@v1.13
        with:
        repository: 'x-moo/x-moo'
        latest: true
        fileName: '*'
        token: ${{ secrets.TS_GP }}

      - name: Initialize Environment
        working-directory: ./tools
        run: ./main.ps1 setup

      - name: duck Build
        working-directory: ./tools
        run: ./main.ps1 build

      - name: duck clean
        if: always()
        working-directory: ./tools
        run: python main.py clean
