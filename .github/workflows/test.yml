name: Debug Py Test

on: workflow_dispatch

jobs:
  build-core:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Initialize Environment
        run: python main.py setup

      - name: duck Build
        run: python main.py build

      - name: duck clean
        if: always()
        run: python main.py clean